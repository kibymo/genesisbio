<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ .Title }}</title>
    {{/* Use relative "/" for the /index/ alias → home; use Permalink for other aliases */}}
    {{ $target := .RelPermalink }}
    {{ if hasSuffix $target "/index/" }}{{ $target = "/" }}{{ end }}
    <link rel="canonical" href="{{ $target }}">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ $target }}">
</head>
<body>
    <h1>Redirecting…</h1>
    <a href="{{ $target }}">Click here if you are not redirected.</a>
</body>
</html>
