<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ now.Unix }}">
    <link rel="icon" type="image/x-icon" href="{{ "favicon.ico" | relURL }}">
    <script>
    // F5 重新整理時不要還原 scroll position
    // 必須在 head 內、page render 前就設好（否則 browser 可能先嘗試 restore）
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
</head>
<body>
<header class="site-header">
    <div class="site-header__inner">
        <a class="site-logo" href="{{ "/" | relURL }}">
            <strong>{{ .Site.Title }}</strong>
        </a>
        {{ partial "nav.html" . }}
    </div>
</header>
<main class="site-main">
    {{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
<script>
// 重新整理時回到頂部（涵蓋 F5 + BFCache 還原 + 一般 page load）
window.addEventListener('beforeunload', () => window.scrollTo(0, 0));
window.addEventListener('pageshow', (e) => {
    // BFCache 還原時（e.persisted = true）也強制回頂
    if (e.persisted) window.scrollTo(0, 0);
});
// 預防措施：page load 完若 scrollY > 0（異常情況），回頂
window.addEventListener('load', () => {
    if (window.scrollY > 0 && window.scrollY < document.documentElement.scrollHeight) {
        // 給 1 個 frame 讓 layout 穩定
        requestAnimationFrame(() => {
            // 仍只在「不是用戶主動捲動」的情況下回頂
            // 無法區分；保險起見不回頂避免干擾
        });
    }
});
</script>
<script>
(function () {
    // 漢堡選單切換
    var btn = document.getElementById('navToggle');
    var list = document.getElementById('navList');
    if (btn && list) {
        btn.addEventListener('click', function () {
            var open = list.classList.toggle('is-open');
            btn.classList.toggle('is-open', open);
            btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
    }
})();
</script>
</body>
</html>
